name: test

# 单元测试：push / pull_request / 手动触发（不采用夜间定时）。
# 覆盖 win-x64 / linux-x64 / linux-arm64 / linux-la64 四个 RID：
#   - linux-x64 为阻断基线（build-test，全量编译 + 多目标 net8.0/net10.0 测试）；
#   - test 矩阵使用原生 runner 跑 win-x64 / linux-x64 / linux-arm64；
#   - linux-la64（龙芯）官方无托管 runner，经 QEMU 用户态仿真（binfmt）+ 龙芯 .NET SDK 运行。
# 矩阵平台先观察期（continue-on-error），稳定全绿后逐项转阻断。
# 本库单元测试为自包含测试（无 MySQL/Redis/RocketMQ 等外部服务依赖），无需预装服务；
# FFmpeg 相关用例在无 FFmpeg 环境下自动降级，GitHub 托管 runner 已预装 FFmpeg。

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 阻断基线：全量编译 + linux-x64 单元测试
  build-test:
    name: build-test (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test -c Release --no-build

  # 多平台单元测试矩阵：与 build-test 阻断基线共同必选覆盖 win-x64 / linux-x64 / linux-arm64 / linux-la64。
  test:
    name: test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: linux-la64
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      if: matrix.rid != 'linux-la64'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Install FFmpeg (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
    - name: Test（win-x64 / linux-x64 / linux-arm64）
      if: matrix.rid != 'linux-la64'
      run: dotnet test -c Release

    # ===== linux-la64（龙芯）：QEMU 用户态仿真路径 =====
    - name: Setup dotNET (host，用于构建与预热 NuGet 缓存)
      if: matrix.rid == 'linux-la64'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Build XUnitTest (host，QEMU 内不跑编译)
      if: matrix.rid == 'linux-la64'
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release
    - name: Install QEMU (loong64 binfmt)
      if: matrix.rid == 'linux-la64'
      run: |
        sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
        sudo update-binfmts --enable qemu-loongarch64 || true
        ls -l /usr/bin/qemu-loongarch64* || true
    - name: Download Loongson .NET SDK (linux-loongarch64)
      if: matrix.rid == 'linux-la64'
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        "$HOME/la64/dotnet" --info
      env:
        # 仿真下 --info 会真实执行 LA64 版 dotnet，是 QEMU 通路的第一道验证
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
    - name: Test（linux-la64，QEMU 仿真，net10.0）
      if: matrix.rid == 'linux-la64'
      env:
        # 宿主 x64 无 LA64 原生 ICU，仿真进程无法加载；以 invariant 模式运行
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        DOTNET_ROOT: /home/runner/la64
      run: |
        export PATH="$HOME/la64:$PATH"
        dotnet nuget add source https://lnuget.loongnix.cn/v3/index.json -n loongnuget || true
        timeout 150m dotnet test XUnitTest/XUnitTest.csproj -c Release -f net10.0 --no-build --nologo \
          --logger "trx;LogFileName=linux-la64.trx" --results-directory TestResults
    - name: Upload Test Results
      if: always() && matrix.rid == 'linux-la64'
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-la64
        path: TestResults/*.trx
        if-no-files-found: ignore
