name: aot

# AOT 兼容性：push / pull_request / 手动触发（不采用夜间定时）。
# 覆盖 win-x64 / linux-x64 / linux-arm64 / linux-la64 四个 RID：
#   - aot-analyzer：库侧 AOT/裁剪分析器 0 告警硬约束（net8.0/net10.0，与 RID 无关）；
#   - aot 矩阵：NativeAOT 官方不支持跨 OS 编译，每个 RID 用原生 runner 发布运行冒烟（linux-x64 为阻断基线）；
#   - aot-linux-la64：龙芯无 NativeAOT 后端（ILCompiler 未提供 LA64 支持），
#     以龙芯 .NET SDK + QEMU 用户态仿真运行 JIT 冒烟，覆盖运行期兼容性。
# 新增平台先观察期（continue-on-error），稳定全绿后逐项转阻断。

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AOT 防回归：分析器 0 告警硬约束（与 RID 无关，单一 job）
  aot-analyzer:
    name: aot analyzer check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x
    - name: AOT Analyzer Check（net8.0/net10.0 要求 0 告警）
      run: |
        dotnet build NewLife.Video/NewLife.Video.csproj -f net8.0 -c Release -warnaserror:IL2026,IL2046,IL2057,IL2060,IL2067,IL2070,IL2071,IL2072,IL2075,IL2091,IL2093,IL2095,IL2111,IL3000,IL3002,IL3050
        dotnet build NewLife.Video/NewLife.Video.csproj -f net10.0 -c Release -warnaserror:IL2026,IL2046,IL2057,IL2060,IL2067,IL2070,IL2071,IL2072,IL2075,IL2091,IL2093,IL2095,IL2111,IL3000,IL3002,IL3050

  # NativeAOT 冒烟矩阵：win-x64 / linux-x64 / linux-arm64 原生发布运行。
  # linux-x64 为阻断基线；win-x64 / linux-arm64 观察期，稳定后转阻断。
  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
            experimental: true
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke
            experimental: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT 基线冒烟
      # 同一冒烟工程以 JIT 运行，为 AOT 结果提供对照
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: NativeAOT 发布（${{ matrix.rid }}，要求 0 条 IL 告警）
      shell: bash
      run: |
        set -o pipefail
        dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out 2>&1 | tee publish.log
        if grep -E "warning IL[0-9]+" publish.log; then
          echo "::error::ILC 发布存在告警，必须清零"
          exit 1
        fi
    - name: NativeAOT 运行冒烟（${{ matrix.rid }}）
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # linux-la64（龙芯，必选覆盖）：QEMU 用户态仿真 + 龙芯 SDK，以 JIT 冒烟覆盖运行期兼容性。
  # 分析器告警防线由 aot-analyzer 任务承担；NativeAOT 发布尝试对 LA64 不可用（无 ILCompiler 后端），
  # 待龙芯生态提供 NativeAOT 支持后再评估。
  aot-linux-la64:
    name: aot (linux-la64 / QEMU, JIT)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host，用于构建与预热 NuGet 缓存)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.x
    - name: Build AotSmoke (host，QEMU 内不跑编译)
      run: dotnet build AotSmoke/AotSmoke.csproj -c Release
    - name: Install QEMU (loong64 binfmt)
      run: |
        sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
        sudo update-binfmts --enable qemu-loongarch64 || true
        ls -l /usr/bin/qemu-loongarch64* || true
    - name: Download Loongson .NET SDK (linux-loongarch64)
      run: |
        curl -fL -o "$HOME/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
        "$HOME/la64/dotnet" --info
      env:
        # 仿真下 --info 会真实执行 LA64 版 dotnet，是 QEMU 通路的第一道验证
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
    - name: JIT 冒烟（linux-la64，QEMU 仿真）
      env:
        # 宿主 x64 无 LA64 原生 ICU，仿真进程无法加载；冒烟工程已固化 InvariantGlobalization
        DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        DOTNET_ROOT: /home/runner/la64
      run: |
        export PATH="$HOME/la64:$PATH"
        dotnet nuget add source https://lnuget.loongnix.cn/v3/index.json -n loongnuget || true
        timeout 120m dotnet AotSmoke/bin/Release/net10.0/AotSmoke.dll
