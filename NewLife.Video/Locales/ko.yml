"The V4L2 backend requires a complete ioctl/mmap implementation; device enumeration is supported, while capture awaits native API integration.": "V4L2 백엔드에는 완전한 ioctl/mmap 구현이 필요합니다. 장치 열거는 지원되지만 캡처는 네이티브 API 통합을 기다리고 있습니다."
"Unable to open device [{0}]; no available backend supports it.": "장치 [{0}]을(를) 열 수 없습니다. 사용 가능한 백엔드가 지원하지 않습니다."
