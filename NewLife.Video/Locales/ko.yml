"The DirectShow backend requires the DirectShowLib NuGet package to enable full capture; it is currently a skeleton implementation.": "DirectShow 백엔드에서 전체 캡처를 사용하려면 DirectShowLib NuGet 패키지가 필요합니다. 현재는 스켈레톤 구현입니다."
