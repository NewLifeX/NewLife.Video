"The H.265 decoder does not support encoding.": "O decodificador H.265 não suporta codificação."
"The H.265 encoder does not support decoding.": "O codificador H.265 não suporta decodificação."
"Invalid JPEG: missing SOI marker.": "JPEG inválido: marcador SOI ausente."
"Video file not found.": "Arquivo de vídeo não encontrado."
