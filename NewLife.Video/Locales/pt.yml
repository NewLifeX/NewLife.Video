# Português 词表（pt）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"File not found.": "Arquivo não encontrado."
"Invalid AVI.": "AVI inválido."
"Invalid RIFF.": "RIFF inválido."
"Not an AVI file.": "Não é um arquivo AVI."
"The AV1 decoder does not support encoding; use FFmpegAV1Encoder.": "O decodificador AV1 não suporta codificação; use FFmpegAV1Encoder."
"The AV1 encoder does not support decoding; use FFmpegAV1Decoder.": "O codificador AV1 não suporta decodificação; use FFmpegAV1Decoder."
"The H.264 decoder does not support encoding; use FFmpegH264Encoder.": "O decodificador H.264 não suporta codificação; use FFmpegH264Encoder."
